# so101_arm 是 5 自由度臂, KDL 位置 IK 解 6 维位姿(位置+姿态)是超定的,
# return_approximate_solution=true 时只返回勉强凑姿态的"近似解" ->
# 平移指令 delta_theta 极小且不随命令幅度变化(实测 0.05 与 0.5 m/s 输出相同),
# 表现就是笛卡尔移动"全部失效/慢 50 倍", 而 JointJog 通道不受影响。
# 注释掉求解器后, Servo(servo_calcs.cpp) 的 ik_solver_ 为空, 自动回退
# use_inv_jacobian_=true: delta_theta = J^+ * delta_x, 纯微分运动学, 5DOF 正常工作。
# 代价: 平移时末端姿态不锁(欠定自由度漂移), 遥控场景可接受;
# 需要锁姿态可再用 /servo_node/change_drift_dimensions 服务调 drift 维度。
#
# 与 gazebo 版相同的结论, 原因相同(同为 5DOF + 同一套关节/限位), 直接沿用。
# so101_arm:
#   kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
#   kinematics_solver_search_resolution: 0.0050000000000000001
#   kinematics_solver_timeout: 0.05
{}
